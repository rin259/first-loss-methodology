name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Validate schemas
        run: |
          python3 -m unittest discover -s benchmark -p 'test_*.py'
          python3 benchmark/run_experiments.py --output-dir /tmp/flm-ci-results --samples 10
          python3 benchmark/conservation_schema.py /tmp/flm-ci-results/cases.jsonl --split test
          python3 benchmark/conservation_schema.py /tmp/flm-ci-results/cases.jsonl --split replay
          python3 benchmark/runtime_experiments.py --output-dir /tmp/flm-runtime-results --repetitions 2
          python3 benchmark/validate_postmortem_cases.py benchmark/public_postmortem_cases.jsonl
          python3 benchmark/analyze_results.py
          git diff --exit-code benchmark/results/ANALYSIS.md benchmark/runtime_results/ANALYSIS.md benchmark/llm_results/ANALYSIS.md
      - name: Smoke-check report
        run: test -s /tmp/flm-ci-results/REPORT.md
